name: Rodzina360 - automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Calculation tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run calculation and decision guard tests
        run: npm test
      - name: Validate all ZUS fixture records and calendars
        run: npm run test:fixtures
      - name: Inventory unavailable ZUS-076 to ZUS-086 fixtures (known gap)
        continue-on-error: true
        run: npm run test:fixtures:pending
      - name: Verify TypeScript and production build
        run: npm run build
